name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node:test and node:assert are built in from Node 18 onwards –
          # no npm install step needed.
          node-version: '22'

      - name: Run unit tests
        run: node --test tests/notes.test.mjs
