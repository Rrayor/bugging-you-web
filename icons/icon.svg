<!-- Bug icon for "Bugging You" PWA.
     The deep purple circle background ensures the icon reads well on both
     light and dark OS home-screen/task-bar backgrounds.  -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#1a1a2e"/>

  <!-- Wings (rendered behind body) -->
  <ellipse cx="30" cy="55" rx="13" ry="22"
           fill="#9f67ff" opacity="0.75"
           transform="rotate(-18 30 55)"/>
  <ellipse cx="70" cy="55" rx="13" ry="22"
           fill="#9f67ff" opacity="0.75"
           transform="rotate(18 70 55)"/>

  <!-- Body -->
  <ellipse cx="50" cy="60" rx="16" ry="22" fill="#7c3aed"/>

  <!-- Head -->
  <circle cx="50" cy="36" r="13" fill="#7c3aed"/>

  <!-- Eyes -->
  <circle cx="44" cy="34" r="4" fill="#fff"/>
  <circle cx="56" cy="34" r="4" fill="#fff"/>
  <circle cx="44" cy="34" r="2" fill="#1a1a2e"/>
  <circle cx="56" cy="34" r="2" fill="#1a1a2e"/>

  <!-- Antennae -->
  <line x1="45" y1="24" x2="36" y2="13"
        stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="24" x2="64" y2="13"
        stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="35" cy="12" r="2.5" fill="#c084fc"/>
  <circle cx="65" cy="12" r="2.5" fill="#c084fc"/>

  <!-- Legs (three pairs) -->
  <line x1="36" y1="52" x2="18" y2="47"
        stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="36" y1="60" x2="18" y2="60"
        stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="36" y1="68" x2="20" y2="74"
        stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="82" y2="47"
        stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="64" y1="60" x2="82" y2="60"
        stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="64" y1="68" x2="80" y2="74"
        stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
</svg>
